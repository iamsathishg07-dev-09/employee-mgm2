<div class="modern-header">
  <!-- Top Header -->
  <div class="header-top">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
          <div class="logo-section">
            <i class="bi bi-building me-2"></i>
            <span class="logo-text">{{ pageTitle }}</span>
          </div>
        </div>
        <div class="user-section">
          <div class="dropdown">
            <a class="user-dropdown-toggle" 
               href="javascript:void(0)" 
               id="navbarDropdownUser" 
               role="button" 
               data-bs-toggle="dropdown" 
               aria-expanded="false">
              <div class="user-avatar">
                <i class="bi bi-person-circle"></i>
              </div>
              <div class="user-info">
                <span class="user-name">{{ loggedInUsername || 'Demo User' }}</span>
                <span class="user-role">Administrator</span>
              </div>
              <i class="bi bi-chevron-down ms-2"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end user-dropdown" 
                aria-labelledby="navbarDropdownUser">
              <li>
                <a class="dropdown-item" href="javascript:void(0)" (click)="onLogout()">
                  <i class="bi bi-box-arrow-right me-2"></i>
                  Logout
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Navigation Bar -->
  <div class="header-nav">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center">
        <div class="page-title">
          <i class="bi bi-arrow-right me-2"></i>
          <span>{{ subTitle }}</span>
        </div>
        
        <nav class="main-nav">
          <ul class="nav nav-pills">
            <li class="nav-item">
              <a class="nav-link" 
                 routerLink="/employee-list" 
                 routerLinkActive="active">
                <i class="bi bi-house me-1"></i>
                <span>Home</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" 
                 routerLink="/employee-form" 
                 routerLinkActive="active">
                <i class="bi bi-person-plus me-1"></i>
                <span>Add Employee</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" 
                 routerLink="/project-form" 
                 routerLinkActive="active">
                <i class="bi bi-folder-plus me-1"></i>
                <span>Add Project</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" 
                 routerLink="/project-list" 
                 routerLinkActive="active">
                <i class="bi bi-list-ul me-1"></i>
                <span>Projects</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" 
                 routerLink="/reports" 
                 routerLinkActive="active">
                <i class="bi bi-graph-up me-1"></i>
                <span>Reports</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
