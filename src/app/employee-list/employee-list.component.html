<div class="container mt-4">
    <h1 class="mb-4 text-center">Employee List</h1>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center">
            <label for="pageSize" class="me-2 text-nowrap">Items per page:</label>
            <select id="pageSize" [(ngModel)]="pageSize" (ngModelChange)="onPageSizeChange()" class="form-select w-auto">
                <option [ngValue]="5">5</option>
                <option [ngValue]="10">10</option>
                <option [ngValue]="20">20</option>
                <option [ngValue]="50">50</option>
            </select>
        </div>
        <button class="btn btn-success" (click)="addNewEmployee()">Add New Employee</button>
    </div>

    <div *ngIf="paginatedEmployees.length > 0; else noEmployeesFound">
        <div class="table-responsive">
            <table class="table table-striped table-hover shadow-sm rounded">
                <thead class="table-dark">
                    <tr>
                        <th class="text-center">Name</th>
                        <th class="text-center">Department</th>
                        <th class="text-center">Gender</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let employee of paginatedEmployees">
                        <td class="text-center">{{ employee.name }}</td>
                        <td class="text-center">{{ employee.department }}</td>
                        <td class="text-center">{{ employee.gender }}</td>
                        <td class="text-center">
                            <button class="btn btn-outline-secondary btn-sm me-2" [routerLink]="['/employee-form', employee.id, 'view']">View</button>
                            <button class="btn btn-outline-secondary btn-sm me-2" [routerLink]="['/employee-form', employee.id, 'edit']">Edit</button>
                            <button class="btn btn-outline-danger btn-sm" (click)="deleteEmployee(employee)">Delete</button>

                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <ng-template #noEmployeesFound>
        <div class="alert alert-info text-center">No employees found.</div>
    </ng-template>


    <nav aria-label="Page navigation" *ngIf="totalPages > 1">
        <ul class="pagination justify-content-center">
            <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" (click)="prevPage()" tabindex="-1" aria-disabled="true">Previous</a>
            </li>

            <li class="page-item" *ngFor="let page of getPages()" [class.active]="currentPage === page">
                <a class="page-link" (click)="goToPage(page)">{{ page }}</a>
            </li>

            <li class="page-item" [class.disabled]="currentPage === totalPages">
                <a class="page-link" (click)="nextPage()">Next</a>
            </li>
        </ul>
    </nav>
<app-message
  [message]="message"
  (closed)="message = null">
</app-message>   
</div>
